name: AgentPact Live Offer

on:
  push:
    paths:
      - '.github/workflows/agentpact-live-offer.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Register seller, publish exact-match offer, accept buyer deal
        shell: python
        run: |
          import json, os, time, uuid, urllib.request, urllib.error, urllib.parse

          API='https://api.agentpact.xyz'
          AGENT_ID=str(uuid.uuid4())
          WALLET='0x52513A733D4b52282F2b4f5A91D965D38b64f3BB'
          BUYER='6c0dc532-e64c-4e74-9fdd-2465e01c2a06'
          NEED='3dc0c7bb-e7fc-4815-92df-135770ec49ca'
          PRICE=0.5
          REPO=os.environ['GITHUB_REPOSITORY']
          GHT=os.environ['GH_TOKEN']

          def call(method,path,body=None,key=None):
              data=None if body is None else json.dumps(body).encode()
              h={'content-type':'application/json','user-agent':'blake-agentpact-live-offer/3.1'}
              if key: h['x-api-key']=key
              if method!='GET': h['idempotency-key']=f'{AGENT_ID}-{time.time_ns()}'
              req=urllib.request.Request(API+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode(errors='replace')
                      try: obj=json.loads(raw)
                      except: obj={'raw':raw}
                      return r.status,obj
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try: obj=json.loads(raw)
                  except: obj={'raw':raw}
                  return e.code,obj
              except Exception as e:
                  return 599,{'error':type(e).__name__,'message':str(e)}

          def issue(title,body):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/issues',
                  data=json.dumps({'title':title,'body':body}).encode(),
                  method='POST',
                  headers={'Authorization':f'Bearer {GHT}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'agentpact-live-offer'})
              with urllib.request.urlopen(req,timeout=25) as r: return json.loads(r.read().decode())

          ns,need=call('GET',f'/api/needs/{NEED}')
          bs,buyer=call('GET',f'/api/agents/{BUYER}')
          n=need.get('need',need) if isinstance(need,dict) else {}
          b=buyer.get('agent',buyer) if isinstance(buyer,dict) else {}
          if ns>=400 or bs>=400 or n.get('id')!=NEED or not b.get('auto_buy_enabled'):
              issue('AgentPact target no longer executable',f'Need HTTP {ns}; buyer HTTP {bs}; need matched={n.get("id")==NEED}; auto-buy={b.get("auto_buy_enabled")}.')
              raise SystemExit(2)
          max_auto=b.get('max_auto_deal_price')
          if max_auto is not None and float(max_auto)<PRICE:
              issue('AgentPact target price exceeds auto-buy',f'Buyer max auto-deal price is {max_auto}; required price is {PRICE}.')
              raise SystemExit(2)

          rs,reg=call('POST','/api/auth/register',{'agentId':AGENT_ID,'walletAddress':WALLET})
          key=(reg.get('apiKey') or reg.get('api_key') or reg.get('key') or reg.get('token')) if isinstance(reg,dict) else None
          if rs>=400 or not key:
              issue('AgentPact fresh seller registration failed',f'HTTP {rs}; safe keys={list(reg) if isinstance(reg,dict) else []}.')
              raise SystemExit(3)
          print(f'::add-mask::{key}')
          call('POST',f'/api/agents/{AGENT_ID}/heartbeat',{},key)

          title=n.get('title') or 'Buyer-side onboarding bootstrap test'
          category=n.get('category') or 'onboarding'
          tags=n.get('tags') or ['onboarding','test']
          offer_payload={
              'agentId':AGENT_ID,
              'title':title,
              'descriptionMd':'Immediate exact-price fulfillment for the live onboarding/test need. Generic text delivery; AI-agent execution disclosed.',
              'category':category,
              'tags':tags,
              'basePrice':PRICE,
              'maxPriceDeltaPct':0,
              'fulfillmentType':'generic'
          }
          os_,offer=call('POST','/api/offers',offer_payload,key)
          o=offer.get('offer',offer) if isinstance(offer,dict) else {}
          offer_id=o.get('id')
          if os_>=400 or not offer_id:
              issue('AgentPact exact-match offer failed',f'HTTP {os_}: `{json.dumps(offer)}`')
              raise SystemExit(4)

          # Trigger only documented matching recomputation. Do not invoke buyer/admin autopilot.
          recompute_status,recompute=call('POST','/api/matches/recompute',{})

          # Seller cannot impersonate buyer to propose. Wait for the auto-buy buyer/platform to create the deal.
          deal=None
          deal_id=None
          for _ in range(28):
              call('POST',f'/api/agents/{AGENT_ID}/heartbeat',{},key)
              ds,dobj=call('GET',f'/api/deals?offerId={urllib.parse.quote(offer_id)}')
              rows=dobj if isinstance(dobj,list) else (dobj.get('deals',[]) if isinstance(dobj,dict) else [])
              for d in rows:
                  if not isinstance(d,dict): continue
                  oid=d.get('offerId') or d.get('offer_id')
                  nid=d.get('needId') or d.get('need_id')
                  sid=d.get('sellerAgentId') or d.get('seller_agent_id')
                  if oid==offer_id and nid==NEED and sid==AGENT_ID:
                      deal=d
                      deal_id=d.get('id')
                      break
              if deal_id: break
              time.sleep(15)

          ms,matches=call('GET',f'/api/matches/recommendations?{urllib.parse.urlencode({"agentId":AGENT_ID})}',key=key)
          rows=matches if isinstance(matches,list) else (matches.get('matches',[]) if isinstance(matches,dict) else [])
          target_matches=[]
          for m in rows:
              if not isinstance(m,dict): continue
              mid=m.get('needId') or m.get('need_id')
              moid=m.get('offerId') or m.get('offer_id')
              if mid==NEED and moid==offer_id: target_matches.append(m)

          if not deal_id:
              issue('AgentPact exact 0.5-USDC offer LIVE',f'## Executed\n- Need `{NEED}`\n- Buyer `{BUYER}` (auto-buy enabled)\n- Seller `{AGENT_ID}`\n- Offer `{offer_id}`\n- Price **{PRICE} USDC**\n- Category `{category}`\n- Tags `{", ".join(tags)}`\n- Matching recompute HTTP {recompute_status}\n- Target matches observed: **{len(target_matches)}**\n\nNo buyer-created deal appeared during this execution. Collected revenue: **0**.')
              raise SystemExit(0)

          state_before=deal.get('status')
          accept_status,accept_result=call('POST',f'/api/deals/{deal_id}/accept',{'actorAgentId':AGENT_ID},key)
          get_status,current=call('GET',f'/api/deals/{deal_id}')
          current_deal=current.get('deal',current) if isinstance(current,dict) else {}
          state_after=current_deal.get('status') if isinstance(current_deal,dict) else None
          safe_accept={k:v for k,v in accept_result.items() if all(x not in k.lower() for x in ('key','secret','token'))} if isinstance(accept_result,dict) else accept_result
          issue('AgentPact DEAL ACCEPTED — 0.5 USDC',f'## Executed\n- Need `{NEED}`\n- Buyer `{BUYER}`\n- Seller `{AGENT_ID}`\n- Offer `{offer_id}`\n- Deal `{deal_id}`\n- Price **{PRICE} USDC**\n- State before acceptance: **{state_before}**\n- Seller acceptance HTTP {accept_status}: `{json.dumps(safe_accept)}`\n- State after acceptance: **{state_after}**\n\nA buyer-created deal was accepted by the seller. Collected revenue remains **0** until settlement is independently verified.')
