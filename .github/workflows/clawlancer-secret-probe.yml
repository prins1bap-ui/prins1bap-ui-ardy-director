name: Clawlancer Rail Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  earn:
    runs-on: ubuntu-latest
    steps:
      - name: Register preserve claim deliver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install --quiet cryptography
          python - <<'PY'
          import base64,json,os,time,urllib.request,urllib.error
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          BASE='https://clawlancer.ai/api'
          LISTING_ID='dc273ecc-f949-4fea-b8b4-838130cf77d8'
          DELIVERABLE=base64.b64decode('').decode()
          PUBLIC_KEY=base64.b64decode('')
          def http(url,method='GET',body=None,headers=None):
              h={'Content-Type':'application/json','User-Agent':'dcash-clawlancer-bridge/1.1'}
              if headers:h.update(headers)
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read();return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try:p=json.loads(raw) if raw else {}
                  except Exception:p={}
                  return e.code,p
          def gh_put(path,obj):
              b64=base64.b64encode(json.dumps(obj,indent=2).encode()).decode()
              u=f'https://api.github.com/repos/{os.environ["REPO"]}/contents/{path}'
              h={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}
              return http(u,'PUT',{'message':f'Persist {path}','content':b64},h)
          def find_tx_id(o):
              if isinstance(o,dict):
                  for k in ('transaction_id','transactionId','tx_id'):
                      if o.get(k):return str(o[k])
                  if isinstance(o.get('transaction'),dict) and o['transaction'].get('id'):return str(o['transaction']['id'])
                  for v in o.values():
                      x=find_tx_id(v)
                      if x:return x
              if isinstance(o,list):
                  for v in o:
                      x=find_tx_id(v)
                      if x:return x
          status={'stage':'starting','listing_id':LISTING_ID,'timestamp':int(time.time())}
          s,reg=http(BASE+'/agents/register','POST',{'agent_name':'BAP2686-DailyCash-Agent','description':'Autonomous research, writing, data, and coding worker operated for legitimate paid digital tasks.'})
          if s not in (200,201):s,reg=http(BASE+'/agents/register','POST',{'name':'BAP2686-DailyCash-Agent','bio':'Autonomous research, writing, data, and coding worker operated for legitimate paid digital tasks.'})
          if s not in (200,201):
              status.update(stage='registration_failed',registration_http=s);gh_put('bridge/clawlancer-status.json',status);raise SystemExit(10)
          api_key=reg.get('api_key') or reg.get('key');agent=reg.get('agent') if isinstance(reg.get('agent'),dict) else reg
          agent_id=agent.get('id') or reg.get('agent_id');wallet=agent.get('wallet_address') or reg.get('wallet_address')
          if not api_key or not agent_id:
              status.update(stage='registration_response_incomplete',registration_http=s);gh_put('bridge/clawlancer-status.json',status);raise SystemExit(11)
          print(f'::add-mask::{api_key}')
          creds=json.dumps({'api_key':api_key,'agent_id':agent_id,'wallet_address':wallet},separators=(',',':')).encode()
          aes=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12);cipher=AESGCM(aes).encrypt(nonce,creds,b'clawlancer-dcash-v1')
          pub=serialization.load_pem_public_key(PUBLIC_KEY);wrapped=pub.encrypt(aes,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          env={'v':1,'alg':'RSA-OAEP-SHA256+A256GCM','aad':'clawlancer-dcash-v1','wrapped_key':base64.b64encode(wrapped).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(cipher).decode()}
          gs,_=gh_put('bridge/clawlancer-credential-envelope.json',env)
          if gs not in (200,201):
              status.update(stage='credential_persistence_failed',github_http=gs,agent_id=agent_id,wallet_address=wallet);raise SystemExit(12)
          auth={'Authorization':f'Bearer {api_key}'}
          cs,claim=http(BASE+f'/listings/{LISTING_ID}/claim','POST',{'agent_id':agent_id},auth)
          if cs not in (200,201):
              status.update(stage='claim_failed',claim_http=cs,agent_id=agent_id,wallet_address=wallet);gh_put('bridge/clawlancer-status.json',status);raise SystemExit(20)
          txid=find_tx_id(claim)
          if not txid:
              _,txs=http(BASE+f'/transactions?agent_id={agent_id}','GET',None,auth);arr=txs.get('transactions',txs if isinstance(txs,list) else [])
              if isinstance(arr,list):
                  for t in arr:
                      if isinstance(t,dict) and (str(t.get('listing_id',''))==LISTING_ID or str(t.get('listingId',''))==LISTING_ID):
                          txid=str(t.get('id') or t.get('transaction_id') or '');break
          if not txid:
              status.update(stage='claimed_but_transaction_not_resolved',claim_http=cs,agent_id=agent_id,wallet_address=wallet);gh_put('bridge/clawlancer-status.json',status);raise SystemExit(21)
          ds,_=http(BASE+f'/transactions/{txid}/deliver','POST',{'deliverable':DELIVERABLE},auth)
          status.update(stage='delivered' if ds in (200,201) else 'delivery_failed',agent_id=agent_id,wallet_address=wallet,transaction_id=txid,claim_http=cs,delivery_http=ds,deliverable_words=len(DELIVERABLE.split()))
          gh_put('bridge/clawlancer-status.json',status)
          if ds not in (200,201):raise SystemExit(30)
          print('RAIL_RESULT=DELIVERED');print(f'AGENT_ID={agent_id}');print(f'TRANSACTION_ID={txid}')
          PY
