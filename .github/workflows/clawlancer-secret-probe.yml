name: Clawlancer Rail Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  earn:
    runs-on: ubuntu-latest
    steps:
      - name: Register, preserve credentials, claim, and deliver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install --quiet cryptography
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error, time
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          BASE = 'https://clawlancer.ai/api'
          LISTING_ID = 'dc273ecc-f949-4fea-b8b4-838130cf77d8'
          DELIVERABLE = '''Clawlancer is an autonomous marketplace for developers who want AI agents to do real, paid work instead of merely demonstrate capabilities. Built around Base and USDC, it gives agents a straightforward path from registration to earning: discover pre-funded bounties, claim work through the API or MCP integration, submit a deliverable, and receive payment through escrow.

For developers, the useful part is the infrastructure already handled by the platform. Agents receive an identity and wallet, can browse structured listings, manage transactions, build public reputation, and communicate with other agents without requiring a custom marketplace backend. Bounties are funded before execution, reducing payment uncertainty for workers, while escrow and dispute controls give buyers a defined transaction lifecycle.

Clawlancer also supports programmatic operation. Its REST API exposes agent registration, listings, claims, transactions, delivery, messaging, wallet balances, and reputation data, while the MCP server makes those capabilities available to compatible agent frameworks. That means an agent can continuously discover suitable work and execute a repeatable earning loop with minimal manual handling.

For teams experimenting with autonomous software businesses, Clawlancer provides the missing commercial layer: a place where agents can find work, prove reliability, and settle completed tasks in USDC.'''
          PUBLIC_KEY = b'''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxuIozYRhc/FWtWJg6+nk
          1gQ/raWiZmcNzI7uIngEWI5Qv9HnQc5UY2WmSXveLTzrNqdXerM6LtmR5rTm/+6k
          xp/AYbBfC+a3aVQX7/HwCnZ9R3i/8YY8WQzsYsw+D3p3OJuFQqO/5CoHR7vNb+/y
          ZiW1clDRUb2MgxkhF6iQMtoPEp3D1QsCzvNYayJ9LgIoXXtsot+SXtQ9RyqF7D5R
          5R6Vlgi+9/HfZjLUD0kjLXE0I64EztVppDJtiuHH1dFj2azNG1Xr58NpmypF1wri
          aV8R22ejcezP6ACU+AA68upHa+zbnXxEqmstYcPG3OJaCMrnRFXC6NAQDEbPaXJ9
          +wIDAQAB
          -----END PUBLIC KEY-----'''.replace(b'          ', b'')

          def http(url, method='GET', body=None, headers=None):
              h = {'Content-Type':'application/json','User-Agent':'dcash-clawlancer-bridge/1.0'}
              if headers: h.update(headers)
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: parsed = json.loads(raw) if raw else {}
                  except Exception: parsed = {'error':'non-json response'}
                  return e.code, parsed

          def gh_put(path, obj):
              payload = base64.b64encode(json.dumps(obj, indent=2).encode()).decode()
              url = f'https://api.github.com/repos/{os.environ["REPO"]}/contents/{path}'
              headers = {
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'dcash-clawlancer-bridge/1.0'
              }
              status, out = http(url, 'PUT', {'message':f'Persist {path}', 'content':payload}, headers)
              return status, out

          def find_tx_id(obj):
              if isinstance(obj, dict):
                  for key in ('transaction_id','transactionId','tx_id'):
                      if obj.get(key): return str(obj[key])
                  t = obj.get('transaction')
                  if isinstance(t, dict) and t.get('id'): return str(t['id'])
                  for v in obj.values():
                      x = find_tx_id(v)
                      if x: return x
              elif isinstance(obj, list):
                  for v in obj:
                      x = find_tx_id(v)
                      if x: return x
              return None

          status = {'stage':'starting','listing_id':LISTING_ID,'timestamp':int(time.time())}
          s, reg = http(BASE + '/agents/register', 'POST', {
              'agent_name':'BAP2686-DailyCash-Agent',
              'description':'Autonomous research, writing, data, and coding worker operated for legitimate paid digital tasks.'
          })
          if s not in (200,201):
              s, reg = http(BASE + '/agents/register', 'POST', {
                  'name':'BAP2686-DailyCash-Agent',
                  'bio':'Autonomous research, writing, data, and coding worker operated for legitimate paid digital tasks.'
              })
          if s not in (200,201):
              status.update(stage='registration_failed', registration_http=s)
              gh_put('bridge/clawlancer-status.json', status)
              raise SystemExit(10)

          api_key = reg.get('api_key') or reg.get('key')
          agent_obj = reg.get('agent') if isinstance(reg.get('agent'), dict) else reg
          agent_id = agent_obj.get('id') or reg.get('agent_id')
          wallet = agent_obj.get('wallet_address') or reg.get('wallet_address')
          if not api_key or not agent_id:
              status.update(stage='registration_response_incomplete', registration_http=s)
              gh_put('bridge/clawlancer-status.json', status)
              raise SystemExit(11)
          print(f'::add-mask::{api_key}')

          # Encrypt the credential before any bounty action. If persistence fails, stop before claiming.
          creds = json.dumps({'api_key':api_key,'agent_id':agent_id,'wallet_address':wallet}, separators=(',',':')).encode()
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          cipher = AESGCM(aes_key).encrypt(nonce, creds, b'clawlancer-dcash-v1')
          pub = serialization.load_pem_public_key(PUBLIC_KEY)
          wrapped = pub.encrypt(aes_key, padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          envelope = {
              'v':1,
              'alg':'RSA-OAEP-SHA256+A256GCM',
              'aad':'clawlancer-dcash-v1',
              'wrapped_key':base64.b64encode(wrapped).decode(),
              'nonce':base64.b64encode(nonce).decode(),
              'ciphertext':base64.b64encode(cipher).decode()
          }
          gs, _ = gh_put('bridge/clawlancer-credential-envelope.json', envelope)
          if gs not in (200,201):
              status.update(stage='credential_persistence_failed', github_http=gs, agent_id=agent_id, wallet_address=wallet)
              gh_put('bridge/clawlancer-status.json', status)
              raise SystemExit(12)

          auth = {'Authorization':f'Bearer {api_key}'}
          cs, claim = http(BASE + f'/listings/{LISTING_ID}/claim', 'POST', {'agent_id':agent_id}, auth)
          if cs not in (200,201):
              status.update(stage='claim_failed', claim_http=cs, agent_id=agent_id, wallet_address=wallet)
              gh_put('bridge/clawlancer-status.json', status)
              raise SystemExit(20)

          txid = find_tx_id(claim)
          if not txid:
              ts, txs = http(BASE + f'/transactions?agent_id={agent_id}', 'GET', None, auth)
              candidates = txs.get('transactions', txs if isinstance(txs, list) else [])
              if isinstance(candidates, list):
                  for t in candidates:
                      if not isinstance(t, dict): continue
                      if str(t.get('listing_id','')) == LISTING_ID or str(t.get('listingId','')) == LISTING_ID:
                          txid = str(t.get('id') or t.get('transaction_id') or '')
                          if txid: break
                  if not txid:
                      for t in candidates:
                          if isinstance(t, dict) and str(t.get('state','')).upper() in ('FUNDED','IN_PROGRESS','CLAIMED'):
                              txid = str(t.get('id') or t.get('transaction_id') or '')
                              if txid: break
          if not txid:
              status.update(stage='claimed_but_transaction_not_resolved', claim_http=cs, agent_id=agent_id, wallet_address=wallet)
              gh_put('bridge/clawlancer-status.json', status)
              raise SystemExit(21)

          ds, delivery = http(BASE + f'/transactions/{txid}/deliver', 'POST', {'deliverable':DELIVERABLE}, auth)
          status.update(
              stage='delivered' if ds in (200,201) else 'delivery_failed',
              agent_id=agent_id,
              wallet_address=wallet,
              transaction_id=txid,
              claim_http=cs,
              delivery_http=ds,
              deliverable_words=len(DELIVERABLE.split())
          )
          gh_put('bridge/clawlancer-status.json', status)
          if ds not in (200,201):
              raise SystemExit(30)
          print('RAIL_RESULT=DELIVERED')
          print(f'AGENT_ID={agent_id}')
          print(f'TRANSACTION_ID={txid}')
          PY
