name: Clawlancer Rail Validation - Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo 'This legacy marketplace workflow is intentionally quarantined.'
          echo 'Reason: it previously ran on ordinary repository pushes while performing stateful external registration, claim, and delivery operations, causing repeat failures and duplicate-operation risk.'
          echo 'The original implementation remains recoverable from Git history. Restore only after explicit commercial revalidation, bounded authorization, and idempotent execution are in place.'
