name: Clawlancer Secret Capability Probe

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repository-secret write capability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install --quiet pynacl
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from nacl.public import PublicKey, SealedBox

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = 'https://api.github.com'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'daily-cash-secret-probe'
          }

          def req(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=20) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          status, raw = req(f'{api}/repos/{repo}/actions/secrets/public-key')
          if status != 200:
              print(f'PROBE_RESULT=PUBLIC_KEY_FAILED status={status}')
              raise SystemExit(1)
          pk = json.loads(raw)
          sealed = SealedBox(PublicKey(base64.b64decode(pk['key']))).encrypt(b'probe-only-no-sensitive-data')
          encrypted = base64.b64encode(sealed).decode()
          status, _ = req(
              f'{api}/repos/{repo}/actions/secrets/DCASH_BRIDGE_PROBE',
              'PUT',
              {'encrypted_value': encrypted, 'key_id': pk['key_id']}
          )
          if status not in (201, 204):
              print(f'PROBE_RESULT=SECRET_WRITE_DENIED status={status}')
              raise SystemExit(2)
          del_status, _ = req(f'{api}/repos/{repo}/actions/secrets/DCASH_BRIDGE_PROBE', 'DELETE')
          print(f'PROBE_RESULT=SECRET_WRITE_OK delete_status={del_status}')
          PY
