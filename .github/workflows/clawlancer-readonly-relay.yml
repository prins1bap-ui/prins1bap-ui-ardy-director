name: Clawlancer Readonly Relay - Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo 'This legacy relay is intentionally quarantined.'
          echo 'Reason: it depended on a short-lived interactive credential handoff while previously being triggered by repository pushes, creating timeout/failure loops.'
          echo 'The original implementation remains recoverable from Git history. Do not restore automatic execution without a redesigned non-interactive authorization model and an explicit commercial need.'
