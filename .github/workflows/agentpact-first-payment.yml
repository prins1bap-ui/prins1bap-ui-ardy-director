name: AgentPact First Payment

on:
  push:
    paths:
      - '.github/workflows/agentpact-first-payment.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  target-live-autobuyer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish matching offer and trigger AgentPact matching
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error, urllib.parse, sys

          API = "https://api.agentpact.xyz"
          AGENT_ID = "0f2c810a-38f8-4d8c-90c5-ec3f9f29db6a"
          PAYOUT_WALLET = "0x52513A733D4b52282F2b4f5A91D965D38b64f3BB"
          BUYER_ID = "6c0dc532-e64c-4e74-9fdd-2465e01c2a06"
          NEED_ID = "3dc0c7bb-e7fc-4815-92df-135770ec49ca"
          PRICE = 0.5
          REPO = os.environ["GITHUB_REPOSITORY"]
          GH_TOKEN = os.environ["GH_TOKEN"]

          def api(method, path, body=None, key=None, timeout=30):
              data = None if body is None else json.dumps(body).encode()
              headers = {
                  "content-type": "application/json",
                  "user-agent": "blake-agentpact-autobuy-worker/2.0",
              }
              if method != "GET":
                  headers["idempotency-key"] = f"blake-{AGENT_ID}-{int(time.time()*1000)}"
              if key:
                  headers["x-api-key"] = key
              req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode(errors="replace")
                      try: obj = json.loads(raw)
                      except Exception: obj = {"raw": raw}
                      return r.status, obj
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try: obj = json.loads(raw)
                  except Exception: obj = {"raw": raw}
                  return e.code, obj
              except Exception as e:
                  return 599, {"error": type(e).__name__, "message": str(e)}

          def gh_issue(title, body):
              data = json.dumps({"title": title, "body": body}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/issues",
                  data=data,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {GH_TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "agentpact-first-payment",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          # Confirm that the exact paid need and buyer policy are still live before acting.
          ns, need = api("GET", f"/api/needs/{NEED_ID}")
          bs, buyer = api("GET", f"/api/agents/{BUYER_ID}")
          if ns >= 400 or bs >= 400:
              gh_issue("AgentPact payment target expired", f"Need lookup HTTP {ns}; buyer lookup HTTP {bs}. No offer was posted.")
              sys.exit(2)

          need_obj = need.get("need", need) if isinstance(need, dict) else {}
          buyer_obj = buyer.get("agent", buyer) if isinstance(buyer, dict) else {}
          if need_obj.get("id") != NEED_ID:
              gh_issue("AgentPact payment target invalid", "The canonical need lookup no longer resolves to the selected paid need. No offer was posted.")
              sys.exit(2)
          if not buyer_obj.get("auto_buy_enabled"):
              gh_issue("AgentPact auto-buy target disabled", "The selected buyer no longer has auto-buy enabled. No offer was posted.")
              sys.exit(2)
          max_auto = buyer_obj.get("max_auto_deal_price")
          if max_auto is not None and float(max_auto) < PRICE:
              gh_issue("AgentPact auto-buy price no longer fits", f"Buyer max auto price is {max_auto}; target offer is {PRICE} USDC. No offer was posted.")
              sys.exit(2)

          # Authenticate the seller identity tied to the payout wallet.
          rs, reg = api("POST", "/api/auth/register", {"agentId": AGENT_ID, "walletAddress": PAYOUT_WALLET})
          if rs >= 400 or not isinstance(reg, dict):
              gh_issue("AgentPact seller registration blocked", f"Registration HTTP {rs}. No credential was published. Safe response keys: {list(reg) if isinstance(reg, dict) else []}")
              sys.exit(3)
          key = reg.get("apiKey") or reg.get("api_key") or reg.get("key") or reg.get("token")
          if not key:
              gh_issue("AgentPact seller registration missing credential", "Registration succeeded but did not return an API credential.")
              sys.exit(3)
          print(f"::add-mask::{key}")

          # Keep the seller visible to matching infrastructure.
          api("POST", f"/api/agents/{AGENT_ID}/heartbeat", {}, key)

          title = need_obj.get("title") or "Buyer-side onboarding bootstrap test"
          category = need_obj.get("category") or "onboarding"
          tags = need_obj.get("tags") or ["onboarding", "test"]
          criteria = need_obj.get("acceptance_criteria") or []

          # This is the seller-side action the previous workflow missed. The buyer's
          # auto-buy policy can only purchase a matching seller offer; we cannot and
          # should not impersonate the buyer to call quick_buy/propose as buyer.
          offer_body = {
              "agentId": AGENT_ID,
              "title": title,
              "descriptionMd": "Exact-price fulfillment offer for the currently open onboarding/test need. Seller is ready for immediate generic/text delivery. AI-agent execution disclosed.",
              "category": category,
              "tags": tags,
              "basePrice": PRICE,
              "maxPriceDeltaPct": 0,
              "fulfillmentType": "generic",
          }
          os_, offer = api("POST", "/api/offers", offer_body, key)
          if os_ >= 400:
              gh_issue("AgentPact matching offer blocked", f"Target need `{NEED_ID}` is live, but offer creation returned HTTP {os_}: `{json.dumps(offer)}`")
              sys.exit(4)
          offer_obj = offer.get("offer", offer) if isinstance(offer, dict) else {}
          offer_id = offer_obj.get("id")
          if not offer_id:
              gh_issue("AgentPact matching offer returned no ID", f"Offer response: `{json.dumps(offer)}`")
              sys.exit(4)

          # Ask matching infrastructure to score the seller immediately after listing.
          qs = urllib.parse.urlencode({"agentId": AGENT_ID})
          ms, matches = api("GET", f"/api/matches/recommendations?{qs}", key=key)

          # Observe marketplace state for several minutes. We use read-only probes only;
          # no buyer identity is impersonated and no funds are spent.
          observations = []
          deal_hit = None
          for attempt in range(24):
              api("POST", f"/api/agents/{AGENT_ID}/heartbeat", {}, key)
              for path in [
                  f"/api/deals?agentId={urllib.parse.quote(AGENT_ID)}",
                  f"/api/deals?offerId={urllib.parse.quote(offer_id)}",
              ]:
                  ds, dobj = api("GET", path, key=key)
                  observations.append({"path": path, "status": ds})
                  if ds < 400:
                      rows = dobj if isinstance(dobj, list) else (dobj.get("deals", []) if isinstance(dobj, dict) else [])
                      for d in rows:
                          if not isinstance(d, dict): continue
                          if d.get("offerId") == offer_id or d.get("offer_id") == offer_id or d.get("sellerAgentId") == AGENT_ID or d.get("seller_agent_id") == AGENT_ID:
                              deal_hit = d
                              break
                  if deal_hit: break
              if deal_hit: break
              time.sleep(15)

          match_summary = "unavailable"
          if ms < 400:
              rows = matches if isinstance(matches, list) else (matches.get("matches", []) if isinstance(matches, dict) else [])
              target_rows = [m for m in rows if isinstance(m, dict) and (m.get("needId") == NEED_ID or m.get("need_id") == NEED_ID)]
              match_summary = f"HTTP {ms}; target matches={len(target_rows)}"

          if deal_hit:
              safe_deal = {k:v for k,v in deal_hit.items() if "key" not in k.lower() and "secret" not in k.lower() and "token" not in k.lower()}
              gh_issue(
                  "AgentPact AUTO-BUY DEAL CREATED",
                  f"## Executed marketplace transaction\n- Need: `{NEED_ID}`\n- Buyer: `{BUYER_ID}`\n- Seller: `{AGENT_ID}`\n- Offer: `{offer_id}`\n- Price: **{PRICE} USDC**\n- Matching: {match_summary}\n- Deal observed: `{json.dumps(safe_deal)}`\n\nA buyer-side deal now exists. No payment is counted until settlement is actually verified."
              )
          else:
              probe = observations[-4:] if observations else []
              gh_issue(
                  "AgentPact live auto-buy offer published",
                  f"## Executed marketplace action\n- Need: `{NEED_ID}`\n- Buyer: `{BUYER_ID}` with auto-buy verified enabled\n- Seller: `{AGENT_ID}`\n- Offer: `{offer_id}`\n- Exact price: **{PRICE} USDC**\n- Category: `{category}`\n- Tags: `{', '.join(tags)}`\n- Matching probe: {match_summary}\n- Deal-list probes: `{json.dumps(probe)}`\n\nThe matching offer is live and priced inside the buyer's auto-buy policy. No payment is counted until settlement is verified."
              )
