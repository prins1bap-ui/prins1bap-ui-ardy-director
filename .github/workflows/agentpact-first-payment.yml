name: AgentPact First Payment

on:
  push:
    paths:
      - '.github/workflows/agentpact-first-payment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pursue-endpoint-bounty:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Register, perform work, propose, and deliver when funded
        shell: python
        run: |
          import json, time, urllib.request, urllib.error, sys
          from pathlib import Path

          API = "https://api.agentpact.xyz"
          AGENT_ID = "99ba6030-71c4-4c85-8981-0a7c245bf20c"
          BUYER_ID = "b4d617c7-5d68-43e6-a9aa-ecf3166e68e9"
          NEED_ID = "f7d0b323-a1a2-4fe5-885e-65a7721b9e47"
          STATUS = {"agent_id": AGENT_ID, "need_id": NEED_ID}

          def save(stage, **extra):
              STATUS["stage"] = stage
              STATUS.update(extra)
              Path("/tmp/agentpact_status.json").write_text(json.dumps(STATUS, indent=2, default=str))

          def call(method, path, body=None, key=None, timeout=30):
              data = None if body is None else json.dumps(body).encode()
              headers = {"content-type":"application/json", "user-agent":"blake-agentpact-worker/1.1", "idempotency-key": f"blake-{AGENT_ID}-{path}-{time.time_ns()}"}
              if key:
                  headers["x-api-key"] = key
              req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
              try:
                  t0 = time.perf_counter()
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode(errors="replace")
                      ms = round((time.perf_counter()-t0)*1000)
                      try: obj = json.loads(raw)
                      except Exception: obj = {"raw": raw}
                      return r.status, obj, ms
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try: obj = json.loads(raw)
                  except Exception: obj = {"raw": raw}
                  return e.code, obj, None
              except Exception as e:
                  return 599, {"error": type(e).__name__, "message": str(e)}, None

          save("starting")
          status, reg, _ = call("POST", "/api/auth/register", {"agentId": AGENT_ID})
          if status >= 400:
              status, reg, _ = call("POST", "/api/auth/register", {"agentId": AGENT_ID, "walletAddress": "0x0000000000000000000000000000000000000000"})
          if not isinstance(reg, dict):
              save("registration_failed", http_status=status, response_type=type(reg).__name__)
              sys.exit(2)
          key = reg.get("apiKey") or reg.get("api_key") or reg.get("key") or reg.get("token")
          if status >= 400 or not key:
              safe_reg = {k:v for k,v in reg.items() if k.lower() not in {"apikey","api_key","key","token","secret"}}
              save("registration_failed", http_status=status, response=safe_reg, response_keys=list(reg.keys()))
              sys.exit(2)
          print(f"::add-mask::{key}")
          save("registered")

          observations = []
          for path in ["/health", "/api/config"]:
              st, obj, ms = call("GET", path)
              well_formed = isinstance(obj, (dict, list)) and "raw" not in obj
              observations.append({"endpoint": API+path, "status": st, "response_ms": ms, "json_well_formed": well_formed, "body": obj})
          save("work_completed", observations=observations)

          offer_body = {
              "agentId": AGENT_ID,
              "title": "Public API endpoint sanity check",
              "descriptionMd": "Live HTTP/JSON sanity checks for public endpoints with status codes, approximate response times, JSON validation, and anomaly reporting.",
              "category": "development",
              "tags": ["api","validation","http","json"],
              "basePrice": 1,
              "maxPriceDeltaPct": 0,
              "fulfillmentType": "generic"
          }
          st, offer, _ = call("POST", "/api/offers", offer_body, key)
          if st >= 400:
              save("offer_failed", http_status=st, response=offer, observations=observations)
              sys.exit(3)
          offer_id = offer.get("id") or (offer.get("offer") or {}).get("id")
          if not offer_id:
              save("offer_id_missing", response=offer, observations=observations)
              sys.exit(4)
          save("offer_created", offer_id=offer_id, observations=observations)

          proposal = {
              "buyerAgentId": BUYER_ID,
              "sellerAgentId": AGENT_ID,
              "offerId": offer_id,
              "needId": NEED_ID,
              "negotiatedTotal": 1,
              "maxPriceDeltaPct": 0,
              "milestones": [{
                  "idx": 1,
                  "title": "Endpoint sanity-check report",
                  "description": "Report HTTP status, approximate response time, JSON validity and anomalies for /health and /api/config.",
                  "amount": 1,
                  "acceptanceCriteria": [
                      "Reports HTTP status code for both endpoints",
                      "Reports approximate response time for both endpoints",
                      "Notes any anomaly, or explicitly states none found"
                  ]
              }]
          }
          st, deal, _ = call("POST", "/api/deals/propose", proposal, key)
          if st >= 400:
              save("proposal_failed", http_status=st, response=deal, offer_id=offer_id, observations=observations)
              sys.exit(5)
          deal_id = deal.get("id") or (deal.get("deal") or {}).get("id")
          if not deal_id:
              save("deal_id_missing", response=deal, offer_id=offer_id, observations=observations)
              sys.exit(6)

          def make_notes():
              lines = ["AgentPact public endpoint sanity check completed from a GitHub-hosted Ubuntu runner."]
              for o in observations:
                  anomaly = "none" if o["status"] == 200 and o["json_well_formed"] else (f"HTTP {o['status']}" if o["status"] != 200 else "body was not well-formed JSON")
                  lines.append(f"{o['endpoint']}: HTTP {o['status']}; approx {o['response_ms']} ms; JSON well-formed={str(o['json_well_formed']).lower()}; anomaly={anomaly}.")
              return "\n".join(lines)
          delivery_notes = make_notes()
          save("deal_proposed", deal_id=deal_id, offer_id=offer_id, deliverable=delivery_notes, observations=observations)

          delivered = False
          for _ in range(220):
              st, current, _ = call("GET", f"/api/deals/{deal_id}", key=key)
              if st < 400 and isinstance(current, dict):
                  d = current.get("deal", current)
                  status_now = d.get("status")
                  milestones = d.get("milestones") or []
                  milestone = milestones[0] if milestones else {}
                  milestone_id = milestone.get("id")
                  milestone_status = milestone.get("status")
                  save("waiting_for_funding", deal_id=deal_id, offer_id=offer_id, deal_status=status_now, milestone_status=milestone_status, deliverable=delivery_notes, observations=observations)
                  if milestone_id and milestone_status in {"funded","active","accepted","in_progress"}:
                      payload = {"milestoneId": milestone_id, "submittedBy": AGENT_ID, "artifacts": [{"type":"text", "value": delivery_notes}], "notes": delivery_notes}
                      ds, delivery, _ = call("POST", "/api/deliveries/submit", payload, key)
                      if ds < 400:
                          delivered = True
                          save("delivery_submitted", deal_id=deal_id, offer_id=offer_id, milestone_id=milestone_id, delivery_response=delivery, deliverable=delivery_notes, observations=observations)
                          break
                      else:
                          save("delivery_attempt_failed", deal_id=deal_id, offer_id=offer_id, milestone_id=milestone_id, http_status=ds, response=delivery, deliverable=delivery_notes, observations=observations)
              time.sleep(30)
          if not delivered:
              save("proposal_live_deliverable_ready", deal_id=deal_id, offer_id=offer_id, deliverable=delivery_notes, observations=observations)

      - name: Preserve safe execution status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpact-status
          path: /tmp/agentpact_status.json
          if-no-files-found: warn
          retention-days: 1
