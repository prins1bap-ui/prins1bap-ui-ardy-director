name: AgentPact AutoBuyer Scan

on:
  push:
    paths:
      - '.github/workflows/agentpact-autobuyer-scan.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find live paid needs backed by auto-buy buyers
        shell: python
        run: |
          import json, os, urllib.request, urllib.parse, urllib.error

          API='https://api.agentpact.xyz'
          REPO=os.environ['GITHUB_REPOSITORY']
          TOKEN=os.environ['GH_TOKEN']

          def get(url):
              req=urllib.request.Request(url, headers={'user-agent':'blake-agentpact-autobuyer-scan/1.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          needs=[]
          for offset in (0,200,400,600,800,1000):
              page=get(f'{API}/api/needs?limit=200&offset={offset}')
              if not isinstance(page,list) or not page: break
              needs.extend(page)
              if len(page)<200: break

          buyers={}
          for n in needs:
              aid=n.get('agent_id')
              if not aid or aid in buyers: continue
              try: buyers[aid]=get(f'{API}/api/agents/{aid}')
              except Exception: buyers[aid]={}

          hits=[]
          for n in needs:
              b=buyers.get(n.get('agent_id'),{})
              try: max_budget=float(n.get('budget_max') or 0)
              except: max_budget=0
              if max_budget<=0 or not b.get('auto_buy_enabled'): continue
              max_auto=b.get('max_auto_deal_price')
              try: max_auto=float(max_auto) if max_auto is not None else None
              except: max_auto=None
              if max_auto is not None and max_budget>max_auto: continue
              cats=b.get('auto_buy_categories')
              if cats and n.get('category') not in cats: continue
              hits.append({
                  'need_id':n.get('id'),'title':n.get('title'),'category':n.get('category'),
                  'tags':n.get('tags'),'budget_min':n.get('budget_min'),'budget_max':n.get('budget_max'),
                  'currency':n.get('currency'),'acceptance_criteria':n.get('acceptance_criteria'),
                  'buyer_id':n.get('agent_id'),'buyer_name':b.get('display_name') or b.get('handle'),
                  'max_auto_deal_price':b.get('max_auto_deal_price'),'auto_buy_categories':b.get('auto_buy_categories')
              })

          hits.sort(key=lambda x: float(x.get('budget_max') or 0), reverse=True)
          body=['## Current auto-buy-backed paid needs','',f'Scanned **{len(needs)}** open needs; found **{len(hits)}** whose buyer currently has auto-buy enabled and whose posted maximum budget fits that buyer policy.','']
          for h in hits[:50]:
              body += [f"### {h['title']}", f"- Need: `{h['need_id']}`", f"- Budget: **{h['budget_min']}–{h['budget_max']} {h['currency']}**", f"- Category: `{h['category']}`", f"- Tags: `{', '.join(h['tags'] or [])}`", f"- Buyer: `{h['buyer_name']}` (`{h['buyer_id']}`)", f"- Acceptance: {json.dumps(h['acceptance_criteria'])}", '']
          if not hits: body.append('No qualifying auto-buy-backed paid need is live in the scanned market right now.')

          data=json.dumps({'title':'AgentPact auto-buy bounty scan','body':'\n'.join(body)}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{REPO}/issues', data=data, method='POST', headers={'Authorization':f'Bearer {TOKEN}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'agentpact-autobuyer-scan'})
          with urllib.request.urlopen(req, timeout=20) as r:
              print(r.read().decode())
