name: One-time paginated public listings check
on:
  push:
    branches:
      - revenue-live-inventory-20261001
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pagination and check qualification without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,datetime,pathlib
          now=datetime.datetime.now(datetime.timezone.utc)
          rows=[]
          for param in ("?take=30&skip=0","?take=30&skip=30","?take=30&skip=60","?take=30&skip=90","?take=30&skip=120","?take=30&page=2","?take=30&page=3","?take=100&offset=30"):
            url="https://earn.superteam.fun/api/listings"+param
            record={"query":param,"code":None,"items":[]}
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"PublicListingAudit/1.0"})
              with urllib.request.urlopen(req,timeout=15) as res:
                raw=res.read(950000);record["code"]=res.status
              root=json.loads(raw)
              if isinstance(root,dict):
                record["root_keys"]=list(root)[:16]
                for key in ("data","listings","result"):
                  sub=root.get(key)
                  if isinstance(sub,list):root=sub;break
                  if isinstance(sub,dict):
                    for key2 in ("listings","items","data"):
                      if isinstance(sub.get(key2),list):root=sub[key2];break
                    if isinstance(root,list):break
              if isinstance(root,list):
                record["count"]=len(root)
                for obj in root[:100]:
                  if not isinstance(obj,dict):continue
                  fields=("id","slug","title","type","status","agentAccess","rewardAmount","reward","compensationType","deadline","deadlineAt","publishedAt","createdAt","isFeatured")
                  record["items"].append({key:str(obj.get(key,""))[:230] for key in fields if key in obj})
                record["first_id"]=record["items"][0].get("id") if record["items"] else None
                record["last_id"]=record["items"][-1].get("id") if record["items"] else None
              else:
                record["shape"]="unexpected"
                record["excerpt"]=str(root)[:160]
            except urllib.error.HTTPError as e:record["code"]=e.code
            except Exception as e:record["error"]=str(e)[:180]
            print("PAGE",param,record.get("code"),record.get("count"),"FIRST",record.get("first_id"),flush=True)
            rows.append(record)
          out={"utc":now.isoformat(),"pages":rows}
          path=pathlib.Path(".revenue-inventory/superteam-pages-20261001.json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Record non-secret official public listing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .revenue-inventory/superteam-pages-20261001.json
          git commit -m "Record paginated public listings audit" || exit 0
          git push origin HEAD:revenue-live-inventory-20261001
