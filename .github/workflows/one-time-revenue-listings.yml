name: One-time public reward listing check
on:
  push:
    branches:
      - revenue-live-inventory-20261001

permissions:
  contents: read

jobs:
  public-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch official public listings without signup or secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          sources = [
              "https://earn.superteam.fun/api/listings?take=100",
              "https://superteam.fun/api/listings?take=100",
              "https://earn.superteam.fun/api/agents/listings/live?take=60",
              "https://superteam.fun/api/agents/listings/live?take=60",
          ]
          print("utc", datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          for url in sources:
              print("SOURCE", url, flush=True)
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "RevenueAvailabilityResearch/1.0 (public endpoints only)"
              })
              try:
                  with urllib.request.urlopen(request, timeout=14) as response:
                      status, payload = response.status, response.read(900000)
                      print("STATUS", status, "BYTES", len(payload), "CONTENT_TYPE",
                            response.headers.get("content-type",""), flush=True)
                  data = json.loads(payload)
                  if isinstance(data,dict):
                      print("ROOT_KEYS", list(data)[:20], flush=True)
                      for key in ("listings","data","result"):
                          if key in data and isinstance(data[key],list):
                              data = data[key]
                              break
                          if key in data and isinstance(data[key],dict):
                              sub=data[key]
                              for k in ("listings","items","data"):
                                  if isinstance(sub.get(k),list):
                                      data=sub[k]
                                      break
                              if isinstance(data,list):
                                  break
                  if isinstance(data,list):
                      print("LIST_COUNT",len(data),flush=True)
                      kept = 0
                      for item in data[:100]:
                          if not isinstance(item,dict):
                              continue
                          status = str(item.get("status","")).upper()
                          access = str(item.get("agentAccess",item.get("agent_access",""))).upper()
                          deadline = str(item.get("deadline",item.get("deadlineAt","")))
                          if status not in ("OPEN","ACTIVE","PUBLISHED","") or (access not in ("","AGENT_ALLOWED","AGENT_ONLY")):
                              continue
                          keys=("id","slug","title","type","status","agentAccess","deadline","reward","rewardAmount","compensation","isWinnersAnnounced")
                          print("CANDIDATE",json.dumps({k:str(item.get(k))[:230] for k in keys if k in item},ensure_ascii=True),flush=True)
                          kept += 1
                          if kept == 18:break
                      print("CANDIDATE_COUNT_SHOWN",kept,flush=True)
                  elif isinstance(data,dict):
                      print("BODY_KEYS",list(data)[:25],flush=True)
                      print("NON_SECRET_SUMMARY",str(data.get("message",data.get("error","no message")))[:300],flush=True)
                  else:print("BODY_TYPE",str(type(data)),flush=True)
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR",e.code,flush=True)
              except Exception as e:
                  print("FETCH_ERROR",str(e)[:260],flush=True)
          PY
