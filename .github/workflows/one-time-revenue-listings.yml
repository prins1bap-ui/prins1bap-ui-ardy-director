name: One-time public reward listing check
on:
  push:
    branches:
      - revenue-live-inventory-20261001

permissions:
  contents: write

jobs:
  public-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch official public listings; save only non-secret summaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime, pathlib
          now=datetime.datetime.now(datetime.timezone.utc)
          report={"checked_at_utc":now.isoformat(),"sources":[]}
          urls=[
            "https://earn.superteam.fun/api/listings?take=100",
            "https://superteam.fun/api/listings?take=100",
            "https://superteam.fun/api/agents/listings/live?take=60",
          ]
          for url in urls:
            entry={"source":url,"status":"unknown","candidates":[]}
            print("Checking",url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ReadOnlyRewardAvailabilityCheck/1.0"})
              with urllib.request.urlopen(req,timeout=15) as resp:
                entry["http_status"]=resp.status
                raw=resp.read(750000)
              d=json.loads(raw)
              if isinstance(d,dict):
                entry["root_keys"]=list(d)[:12]
                for key in ("listings","data","result"):
                  z=d.get(key)
                  if isinstance(z,list):d=z;break
                  if isinstance(z,dict):
                    for k in ("listings","data","items"):
                      if isinstance(z.get(k),list):d=z[k];break
                    if isinstance(d,list):break
              if isinstance(d,list):
                entry["total_in_response"]=len(d)
                entry["status"]="ok"
                for z in d[:100]:
                  if not isinstance(z,dict):continue
                  state=str(z.get("status","")).upper()
                  access=str(z.get("agentAccess",z.get("agent_access",""))).upper()
                  if state not in ("OPEN","ACTIVE","PUBLISHED"):continue
                  if access not in ("AGENT_ALLOWED","AGENT_ONLY"):continue
                  deadline=str(z.get("deadline") or z.get("deadlineAt") or "")
                  if deadline:
                    try:
                      dt=datetime.datetime.fromisoformat(deadline.replace("Z","+00:00"))
                      if dt.tzinfo is not None and dt<now:continue
                    except (ValueError,TypeError):pass
                  allowed=("id","slug","title","name","type","status","agentAccess","deadline","deadlineAt","compensationType","rewards","reward","totalReward","rewardAmount","maxReward","minReward")
                  entry["candidates"].append({k:str(z[k])[:250] for k in allowed if k in z})
                  if len(entry["candidates"])>=30:break
              else:
                entry["status"]="non-list-json"
                if isinstance(d,dict):
                  entry["response_keys"]=list(d)[:20]
                  entry["message"]=str(d.get("message",d.get("error","")))[:180]
            except urllib.error.HTTPError as e:
              entry["status"]="http-error"
              entry["http_status"]=e.code
            except Exception as e:
              entry["status"]="fetch-error"
              entry["error"]=str(e)[:200]
            print("RESULT",entry["status"],"COUNT",len(entry["candidates"]),flush=True)
            report["sources"].append(entry)
          target=pathlib.Path(".revenue-inventory/superteam-public-listings-20261001.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf8")
          PY
      - name: Commit result on isolated branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .revenue-inventory/superteam-public-listings-20261001.json
          git commit -m "Record official public listing readback from one-time check" || exit 0
          git push origin HEAD:revenue-live-inventory-20261001
