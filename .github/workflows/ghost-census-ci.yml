name: Ghost Census read-only audit

on:
  push:
    branches:
      - 'bounty/1f916-ghost-census'
  pull_request:
    paths:
      - 'ghost-census/**'
      - '.github/workflows/ghost-census-ci.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove read-only surface
        run: node ghost-census/check-readonly.mjs
