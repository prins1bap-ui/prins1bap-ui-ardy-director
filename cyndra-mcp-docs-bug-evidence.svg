<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#ffffff"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#111111">Cyndra API Docs — MCP Tool Count Mismatch</text>
  <text x="70" y="135" font-family="Arial, sans-serif" font-size="22" fill="#444444">Evidence captured 2026-09-14 from https://www.cyndra.ai/api-docs</text>
  <rect x="70" y="185" width="1260" height="115" rx="12" fill="#f4f4f4" stroke="#999999"/>
  <text x="105" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111111">Documentation claim</text>
  <text x="105" y="275" font-family="Arial, sans-serif" font-size="27" fill="#111111">“six read-only tools”</text>
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111111">Tools actually listed on the same page</text>
  <text x="105" y="420" font-family="monospace" font-size="26" fill="#111111">1. search_cyndra_content</text>
  <text x="105" y="470" font-family="monospace" font-size="26" fill="#111111">2. get_cyndra_page</text>
  <text x="105" y="520" font-family="monospace" font-size="26" fill="#111111">3. list_cyndra_pages</text>
  <text x="105" y="570" font-family="monospace" font-size="26" fill="#111111">4. get_cyndra_pricing</text>
  <text x="105" y="620" font-family="monospace" font-size="26" fill="#111111">5. get_cyndra_changelog</text>
  <rect x="70" y="675" width="1260" height="185" rx="12" fill="#fff8e8" stroke="#b78400"/>
  <text x="105" y="730" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111111">Mismatch</text>
  <text x="105" y="775" font-family="Arial, sans-serif" font-size="25" fill="#111111">The page claims six MCP tools but documents only five.</text>
  <text x="105" y="815" font-family="Arial, sans-serif" font-size="25" fill="#111111">The FAQ also references case-study fetching, while the MCP list omits it.</text>
  <text x="70" y="925" font-family="Arial, sans-serif" font-size="21" fill="#555555">Reproduction: open /api-docs → scroll to “MCP” → count the listed tools → compare with the six-tool claim and FAQ.</text>
</svg>